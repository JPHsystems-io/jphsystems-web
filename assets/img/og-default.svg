<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#5b7cfa" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#5b7cfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0%" stop-color="#4fd6b0" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#4fd6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
