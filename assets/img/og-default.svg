  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Decorative node graph -->
  <g opacity="0.55">
    <path d="M905 150 C 1000 150 1010 260 1090 260" stroke="#5b7cfa" stroke-opacity="0.35" fill="none" stroke-width="1.4"/>
    <path d="M905 370 C 1000 370 1010 260 1090 260" stroke="#ffffff" stroke-opacity="0.14" fill="none" stroke-width="1.2"/>
    <path d="M905 150 C 980 150 960 370 905 370" stroke="#ffffff" stroke-opacity="0.10" fill="none" stroke-width="1.2"/>
    <circle cx="905" cy="150" r="7" fill="#080a0d" stroke="#ffffff" stroke-opacity="0.25"/>
    <circle cx="905" cy="370" r="7" fill="#080a0d" stroke="#ffffff" stroke-opacity="0.25"/>
    <circle cx="1090" cy="260" r="9" fill="#5b7cfa"/>
    <circle cx="1090" cy="260" r="20" fill="none" stroke="#5b7cfa" stroke-opacity="0.3"/>
  </g>

  <!-- Brand -->
  <g transform="translate(80 70)">
    <g transform="scale(1.55)">
      <path d="M16 3.2 26.4 6.9v9.5c0 6.2-4.3 10.6-10.4 12.4C9.9 27 5.6 22.6 5.6 16.4V6.9L16 3.2Z"
