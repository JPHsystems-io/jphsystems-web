  </g>

  <!-- Copy -->
  <text x="80" y="238" font-family="Menlo, monospace" font-size="17" letter-spacing="2.4" fill="#93a7ff">CYBERSECURITY · NETWORK SECURITY · PRODUCT ENGINEERING</text>

  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="400"
