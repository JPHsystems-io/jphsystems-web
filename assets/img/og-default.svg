      <circle cx="16" cy="17.2" r="2.9" fill="#5b7cfa"/>
      <circle cx="16" cy="9.4" r="2.1" fill="#eef1f5" opacity="0.55"/>
      <circle cx="11.2" cy="20.2" r="2.1" fill="#eef1f5" opacity="0.55"/>
      <circle cx="20.8" cy="20.2" r="2.1" fill="#eef1f5" opacity="0.55"/>
